<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space War</title>
  <style>
    :root { --bg: #02040a; --b: #c7be1f; }
    * { box-sizing: border-box; margin: 0; }
    body { width: 100vw; height: 100vh; background: var(--bg); color: #fff; font-family: Arial; overflow: hidden; }
    button { font: inherit; cursor: pointer; }
    #selectionView { position: relative; width: 100%; height: 100%; background: url("background.jpg") center/cover; }
    
    .zone { position: absolute; top: 0; width: calc(50% - 120px); height: 100%; cursor: pointer; z-index: 2; }
    .left { left: 0; } .right { right: 0; }
    .zone svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .zone path { fill: var(--bg); stroke: var(--b); stroke-width: 2; }
    
    .content { position: absolute; top: 50%; width: 75%; transform: translateY(-50%); z-index: 3; }
    .left .content { left: 10%; } .right .content { right: 10%; text-align: right; }
    
    .title { font-size: clamp(60px, 8vw, 96px); line-height: 1; }
    .label { margin: 20px 0 28px; color: var(--b); font-size: 12px; letter-spacing: 3px; }
    .records { margin-bottom: 28px; }
    .record { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 13px; }
    .right .record { flex-direction: row-reverse; }
    .dots { flex: 1; border-bottom: 1px dotted #666; }
    .value { color: var(--b); font-size: 12px; }
    
    .select-button { padding: 15px 25px; background: var(--bg); color: #fff; border: 2px solid var(--b); font-weight: bold; }
    .zone.active .select-button { background: #e5045e; }
    
    .center { position: absolute; top: 50%; left: 50%; width: 240px; height: 128px; transform: translate(-50%,-50%); display: flex; align-items: center; justify-content: center; background: var(--bg); border: 2px solid var(--b); z-index: 5; }
    #playButton { padding: 40px 55px; background: #e7ce11; color: #fff; border: 2px solid #fff; font-size: 50px; font-weight: bold; }
    
    @media (max-width: 700px) {
      body { overflow-y: auto; }
      #selectionView { height: auto; min-height: 100vh; }
      .zone { position: relative; width: 100%; min-height: 320px; }
      .zone svg { display: none; }
      .left, .right { left: auto; right: auto; border: 1px solid var(--b); }
      .content { position: relative; top: auto; left: auto !important; right: auto !important; width: 100%; transform: none; padding: 40px 30px; text-align: left !important; }
      .right .record { flex-direction: row; }
      .center { position: relative; top: auto; left: auto; width: calc(100% - 30px); height: 150px; transform: none; margin: 15px auto; }
    }
  </style>
</head>
<body>

  <main id="selectionView">
    <!-- LEFT: 180° -->
    <section class="zone left active" data-mode="180">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L100 37 L100 63 L0 100 Z"/></svg>
      <div class="content">
        <h1 class="title">180°</h1>
        <p class="label">Forward War Zone</p>
        <div class="records">
          <div class="record"><span>Best Score</span><span class="dots"></span><strong class="value" id="score180">0</strong></div>
          <div class="record"><span>Best Time</span><span class="dots"></span><strong class="value" id="time180">0s</strong></div>
          <div class="record"><span>Runs</span><span class="dots"></span><strong class="value" id="runs180">0</strong></div>
        </div>
        <button class="select-button">SELECT 180°</button>
      </div>
    </section>

    <!-- CENTER PLAY -->
    <section class="center">
      <button id="playButton">PLAY</button>
    </section>

    <!-- RIGHT: 360° -->
    <section class="zone right" data-mode="360">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 37 L100 0 L100 100 L0 63 Z"/></svg>
      <div class="content">
        <h1 class="title">360°</h1>
        <p class="label">Open War Zone</p>
        <div class="records">
          <div class="record"><span>Best Score</span><span class="dots"></span><strong class="value" id="score360">0</strong></div>
          <div class="record"><span>Best Time</span><span class="dots"></span><strong class="value" id="time360">0s</strong></div>
          <div class="record"><span>Runs</span><span class="dots"></span><strong class="value" id="runs360">0</strong></div>
        </div>
        <button class="select-button">SELECT 360°</button>
      </div>
    </section>
  </main>

  <script>
    let mode = "180";

    // Load saved records from localStorage upon page load
    ['180', '360'].forEach(m => {
      document.getElementById(`score${m}`).textContent = localStorage.getItem(`score${m}`) || 0;
      document.getElementById(`time${m}`).textContent = (localStorage.getItem(`time${m}`) || 0) + 's';
      document.getElementById(`runs${m}`).textContent = localStorage.getItem(`runs${m}`) || 0;
    });

    // Handle clicks for layout activation & playing the selected mode
    document.onclick = e => {
      let z = e.target.closest(".zone");
      if (z) {
        mode = z.dataset.mode;
        document.querySelectorAll(".zone").forEach(x => x.classList.toggle("active", x === z));
      }
      if (e.target.id === "playButton") location.href = `${mode}-game.html`;
    };
  </script>
</body>
</html>
